name: Publish Mateo bedtime chapter

on:
  push:
    branches: [main]
    paths:
      - "publication-requests/chapter-*.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bedtime-chapter-publishing
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install audio tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Merge, validate, and catalog the chapter
        run: python3 scripts/publish_from_request.py
      - name: Commit finished chapter to GitHub Pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs/episodes.json docs/audio publication-requests
          if git diff --staged --quiet; then
            echo "No changes to publish"
            exit 0
          fi
          git commit -m "Publish next Mateo bedtime chapter"
          git push origin HEAD:main
